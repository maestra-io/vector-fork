# Maestra fork CI: test the patched nats source against a real nats-server, then
# build the release binary and push the image to the maestra ECR (us-west-2).
# Needs Teleport token image-push-github-actions-vector-fork (maestra-io/fluxcd#19561).
# The upstream workflows are removed on the maestra/* branches: they need
# upstream secrets and runners.
name: maestra

on:
  pull_request:
    branches: ["maestra/**"]
  push:
    branches: ["maestra/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-vector-fork
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: vector-fork
  # <upstream version>-maestra.<fork revision>. Bump the left half on every
  # rebase onto a new upstream tag (and UPSTREAM in the Dockerfile), the right
  # half on every fork-only change. Quoted: a version scalar is a YAML float trap.
  UPSTREAM_VERSION: "0.58.0"
  IMAGE_VERSION: "0.58.0-maestra.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler cmake libsasl2-dev
      - name: nats-server with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.12 -js
      - name: nats source unit and integration tests
        env:
          NATS_JETSTREAM_ADDRESS: nats://localhost:4222
          NATS_ADDRESS: nats://localhost:4222
        # The other ::nats:: integration tests need the auth/TLS server matrix of
        # tests/integration/nats; the JetStream ones need only this server.
        run: >-
          cargo test --locked --no-default-features --features nats-integration-tests
          --lib sources::nats -- --skip nats_userpass --skip nats_token --skip nats_nkey
          --skip nats_tls --skip nats_multiple_urls
      - name: "E2E: bounded sink retries + sink down longer than them -> 0 loss"
        run: |
          cargo build --locked --no-default-features --features sources-nats,sinks-http --bin vector
          tests/maestra/bounded-retries-e2e.sh target/debug/vector 2000 40

  image:
    needs: test
    if: github.event_name != 'pull_request'
    # OIDC only here: the test job runs PR code (build scripts, tests).
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: ecr-publish-vector-fork
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The upstream release features and profile (fat LTO), built in bookworm so
      # the binary's glibc matches the distroless-libc base.
      - name: Build vector
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VECTOR_BUILD_DESC="maestra ${IMAGE_VERSION}" \
            rust:1.95-bookworm bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends cmake clang libclang-dev protobuf-compiler libsasl2-dev perl zlib1g-dev git
              git config --global --add safe.directory /src
              cargo build --release --locked --no-default-features --features target-x86_64-unknown-linux-gnu --bin vector
              ldd target/release/vector
              target/release/vector --version'
          mkdir -p dist && cp target/release/vector dist/vector

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to resolve Teleport version from /webapi/find"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Teleport
        uses: teleport-actions/setup@v1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT
          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # Image-build ECR repositories are created by CI, not terraform
          # (aws-infra ecr-eu-forget.tf); the org-wide pull policy is set on every run.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} >/dev/null
          aws ecr set-repository-policy --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --policy-text file://.github/ecr-policy.json >/dev/null

      - name: Build and push the image
        run: |
          IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}"
          # A released version tag is immutable: a fork-only change bumps IMAGE_VERSION.
          if aws ecr describe-images --repository-name "${IMAGE_NAME}" --region "${AWS_REGION}" \
             --image-ids imageTag="${IMAGE_VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${IMAGE_VERSION} already exists; bump IMAGE_VERSION"
            exit 1
          fi
          docker build \
            --build-arg UPSTREAM="${UPSTREAM_VERSION}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="${IMAGE_VERSION}" \
            -f distribution/maestra/Dockerfile \
            -t "$IMAGE:${IMAGE_VERSION}" -t "$IMAGE:${GITHUB_SHA::12}" \
            dist
          docker push "$IMAGE:${IMAGE_VERSION}"
          docker push "$IMAGE:${GITHUB_SHA::12}"
